<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Analytics</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <header>
        <h1>Analytics</h1>
        <nav>
            <a href="/">Home</a>
            <a href="/candidates">Recruitment</a>
            <a href="/employee_support">Employee Support</a>
            <a href="/analytics">Analytics</a>
        </nav>
    </header>
    <main>
        <h2>Workforce Insights</h2>
        <p>Total Candidates: {{ total_candidates }}</p>
        <p>Total Queries: {{ total_queries }}</p>
        <h3>Counts Chart</h3>
        <canvas id="countsChart" width="400" height="200"></canvas>
        <script>
            const ctx = document.getElementById('countsChart').getContext('2d');
            new Chart(ctx, {{ chart_config | tojson }});
        </script>
    </main>
</body>
</html>
